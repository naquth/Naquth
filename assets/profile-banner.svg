<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Naquth Profile Banner</title>
  <desc id="desc">Black and white glass-style banner with the name Naquth, subtitle Web Developer, and service tags.</desc>
  <style>
    .float1 { animation: f1 7s ease-in-out infinite; }
    .float2 { animation: f2 9s ease-in-out infinite; }
    .shine  { animation: sh 4s ease-in-out infinite; }
    .pulse  { animation: pl 2s ease-in-out infinite; }
    .rise   { animation: rs 1.1s ease-out both; }
    @keyframes f1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes f2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
    @keyframes sh { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes pl { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes rs { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="82" y1="28" x2="1182" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#1C1C1C"/>
    </linearGradient>
    <linearGradient id="panel" x1="114" y1="72" x2="786" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.14"/>
      <stop offset="1" stop-color="white" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="panelStroke" x1="146" y1="74" x2="1080" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.34"/>
      <stop offset="1" stop-color="white" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="tagFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="white" stop-opacity="0.14"/>
      <stop offset="1" stop-color="white" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="floatGlass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="white" stop-opacity="0.12"/>
      <stop offset="1" stop-color="white" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 90) rotate(131.982) scale(360 234)">
      <stop stop-color="white" stop-opacity="0.16"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 290) rotate(-176.669) scale(512 189)">
      <stop stop-color="white" stop-opacity="0.10"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(234 72) rotate(38.7717) scale(270 186)">
      <stop stop-color="white" stop-opacity="0.09"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1044" cy="102" r="176" fill="url(#glowA)"/>
  <circle cx="974" cy="292" r="238" fill="url(#glowB)"/>
  <circle cx="252" cy="86" r="146" fill="url(#glowC)"/>

  <rect x="62" y="50" width="1156" height="260" rx="30" fill="white" fill-opacity="0.025"/>
  <rect x="62.5" y="50.5" width="1155" height="259" rx="29.5" stroke="white" stroke-opacity="0.10"/>

  <path d="M890 62C994 76 1082 124 1172 182" stroke="white" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M864 106C950 120 1044 162 1140 234" stroke="white" stroke-opacity="0.06" stroke-width="2"/>

  <!-- main glass panel -->
  <rect x="92" y="72" width="744" height="214" rx="28" fill="url(#panel)"/>
  <rect x="92.75" y="72.75" width="742.5" height="212.5" rx="27.25" stroke="url(#panelStroke)"/>

  <!-- accent bar -->
  <g class="shine">
    <path d="M124 104H278" stroke="white" stroke-opacity="0.9" stroke-width="8" stroke-linecap="round"/>
    <path d="M124 104H222" stroke="black" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g class="rise">
    <text x="124" y="168" fill="white" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="0.4">Naquth</text>
    <text x="124" y="209" fill="#CFCFCF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="500">Web Developer · Websites · Web Apps · Online Stores</text>
  </g>

  <g opacity="0.96">
    <rect x="124" y="238" width="168" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="124.5" y="238.5" width="167" height="33" rx="16.5" stroke="white" stroke-opacity="0.18"/>
    <text x="208.0" y="260" text-anchor="middle" fill="#E5E5E5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">Company Websites</text>
    <rect x="306" y="238" width="101" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="306.5" y="238.5" width="100" height="33" rx="16.5" stroke="white" stroke-opacity="0.18"/>
    <text x="356.5" y="260" text-anchor="middle" fill="#E5E5E5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">Web Apps</text>
    <rect x="421" y="238" width="143" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="421.5" y="238.5" width="142" height="33" rx="16.5" stroke="white" stroke-opacity="0.18"/>
    <text x="492.5" y="260" text-anchor="middle" fill="#E5E5E5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">Online Stores</text>
    <rect x="578" y="238" width="76" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="578.5" y="238.5" width="75" height="33" rx="16.5" stroke="white" stroke-opacity="0.18"/>
    <text x="616.0" y="260" text-anchor="middle" fill="#E5E5E5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">UI/UX</text>
    <rect x="668" y="238" width="126" height="34" rx="17" fill="url(#tagFill)"/>
    <rect x="668.5" y="238.5" width="125" height="33" rx="16.5" stroke="white" stroke-opacity="0.18"/>
    <text x="731.0" y="260" text-anchor="middle" fill="#E5E5E5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">Maintenance</text>
  </g>

  <!-- right floating glass card -->
  <g class="float1">
    <rect x="884" y="96" width="300" height="108" rx="26" fill="url(#floatGlass)"/>
    <rect x="884.5" y="96.5" width="299" height="107" rx="25.5" stroke="white" stroke-opacity="0.22"/>
    <circle cx="916" cy="130" r="5" fill="white" class="pulse"/>
    <text x="934" y="135" fill="white" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Open for projects</text>
    <path d="M910 154H1158" stroke="white" stroke-opacity="0.14"/>
    <text x="910" y="182" fill="#CFCFCF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">First consultation is free</text>
  </g>
  <g class="float2">
    <rect x="974" y="222" width="210" height="48" rx="24" fill="white" fill-opacity="0.07"/>
    <rect x="974.5" y="222.5" width="209" height="47" rx="23.5" stroke="white" stroke-opacity="0.2"/>
    <g transform="translate(1002 246)" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none">
      <circle r="9"/><ellipse rx="4" ry="9"/><path d="M-9 0H9"/>
    </g>
    <text x="1022" y="251" fill="white" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">naquth.my.id</text>
  </g>
</svg>
