name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: naquth
          outputs: |
            dist/snake-dark.svg?color_snake=ffffff&color_dots=2a2a2a,525252,858585,bdbdbd,ffffff
            dist/snake.svg?color_snake=000000&color_dots=ebedf0,c4c4c4,8a8a8a,4d4d4d,000000

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
